name: Build and publish learning center

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public learning sources
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install locked Markdown dependency
        run: npm ci
      - name: Verify file persistence, favorites and public output boundaries
        run: npm test
      - name: Build chapter one notes and quizzes
        run: npm run build:chapter-one
      - name: Build chapter two notes and merged exercises
        run: npm run build:chapter-two
      - name: Build chapter three notes and merged exercises
        run: npm run build:chapter-three
      - name: Verify chapter two and three content and links
        run: npm run verify
      - name: Assemble and validate public files
        run: npm run build:site
      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
