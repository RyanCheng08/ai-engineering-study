name: Build and publish learning center

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public learning sources
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install locked Markdown dependency
        run: npm ci
      - name: Verify local file persistence
        run: npm test
      - name: Validate and generate quizzes
        run: python3 可视化页面/测试题/build_quiz.py
      - name: Generate integrated learning notes
        run: node 可视化页面/build-notes.mjs
      - name: Assemble and validate public files
        run: python3 scripts/build-site.py
      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
