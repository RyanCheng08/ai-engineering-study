<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="第一章自测已整合至学习笔记，同页阅读与答题。"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; object-src 'none'; form-action 'none'"><title>第一章自测 · 前往学习笔记</title><style>body{margin:0;padding:40px 20px;background:#f7f6f2;color:#20372d;font:15px/1.9 system-ui,"Microsoft YaHei",sans-serif}main{max-width:560px;margin:8vh auto;padding:28px 32px;border:1px solid #dbe5d9;border-radius:15px;background:#fff}h1{font-size:23px;margin:0 0 12px}p{color:#627468;font-size:13px}a,button{display:inline-block;color:#176b54;border:1px solid #dbe5d9;background:white;border-radius:8px;padding:8px 13px;text-decoration:none;font:13px/1.6 inherit;cursor:pointer}a{background:#176b54;color:white}</style></head><body><main><h1>笔记与自测，现在在同一页</h1><p>正在前往第一章学习笔记中的本节自测。作答记录会尝试一并带入，你也可以导出旧记录留存。</p><a id="continue" href="chapter-one.html#quiz-1">前往本节自测 →</a> <button type="button" id="export">导出旧作答记录</button><noscript><p>启用 JavaScript 后，可在笔记页面内作答。</p></noscript></main><script>(()=>{'use strict';let record=null;try{record=JSON.parse(localStorage.getItem('chapter-one-quiz-v1')||'null')}catch{}const explicit=location.hash.match(/^#1\.([1-7])$/),legacy=location.hash.match(/^#quiz-([1-7])(?:-(0[1-9]|10))?$/);const chapter=explicit?Number(explicit[1]):legacy?Number(legacy[1]):Number.isInteger(record?.selected)&&record.selected>=0&&record.selected<7?record.selected+1:1;const position=legacy?.[2]?Number(legacy[2])-1:record?.positions?.['1.'+chapter];const destination='chapter-one.html#quiz-'+chapter+(Number.isInteger(position)&&position>=0&&position<10?'-'+String(position+1).padStart(2,'0'):'');document.getElementById('continue').href=destination;document.getElementById('export').disabled=!record;document.getElementById('export').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(record,null,2)],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='第一章-旧作答记录.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)});function proceed(){try{if(record?.version===1)window.name=JSON.stringify({kind:'chapter-one-quiz-migration',version:1,record,previousName:window.name,createdAt:Date.now()})}catch{}location.replace(destination)}document.getElementById('continue').addEventListener('click',e=>{e.preventDefault();proceed()});proceed()})();</script></body></html>
